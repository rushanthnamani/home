<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indushree Function Hall</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}
.header{
    background:#5f259f;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}
.container{
    padding:15px;
}
.card{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}
.stat{
    font-size:28px;
    color:#5f259f;
    font-weight:bold;
}
input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:10px;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}
button{
    width:100%;
    background:#5f259f;
    color:white;
    border:none;
    padding:12px;
    border-radius:10px;
    font-size:16px;
}
.booking{
    padding:10px;
    border-bottom:1px solid #ddd;
}
</style>
</head>

<body>

<div class="header">
🏛️ ఇందుశ్రీ ఫంక్షన్ హాల్
</div>

<div class="container">

<div class="card">
<h3>Total Bookings</h3>
<div class="stat" id="bookingCount">0</div>
</div>

<div class="card">
<h3>New Booking</h3>

<input id="customer" placeholder="Customer Name">

<input id="phone" placeholder="WhatsApp Number">

<select id="eventType">
<option>Marriage</option>
<option>Engagement</option>
<option>Birthday</option>
<option>Corporate Gathering</option>
<option>Meeting</option>
</select>

<input id="eventDate" type="date">

<input id="totalAmount" type="number" placeholder="Total Amount">

<input id="advancePaid" type="number" placeholder="Advance Paid">

<button onclick="saveBooking()">Save Booking</button>

</div>

<div class="card">
<h3>Bookings</h3>
<div id="bookings"></div>
</div>

</div>

<script>

let bookings =
JSON.parse(localStorage.getItem("bookings") || "[]");

render();

function saveBooking(){

let booking={

id:"BK-"+new Date().getFullYear()+"-"+String(bookings.length+1).padStart(3,'0'),

customer:
document.getElementById("customer").value,

phone:
document.getElementById("phone").value,

eventType:
document.getElementById("eventType").value,

eventDate:
document.getElementById("eventDate").value,

totalAmount:
document.getElementById("totalAmount").value,

advancePaid:
document.getElementById("advancePaid").value

};

bookings.push(booking);

localStorage.setItem(
"bookings",
JSON.stringify(bookings)
);

render();

alert(
"Booking Saved\n" +
booking.id
);

}

function render(){

document.getElementById("bookingCount").innerHTML=
bookings.length;

let html="";

bookings.forEach(function(b){

let balance=
(Number(b.totalAmount||0))-
(Number(b.advancePaid||0));

html +=
'<div class="booking">' +
'<b>'+b.id+'</b><br>' +
b.customer + '<br>' +
b.eventType + '<br>' +
'₹'+b.totalAmount +
' | Due ₹'+balance +
'</div>';

});

document.getElementById("bookings").innerHTML=
html;

}

</script>

</body>
</html>
